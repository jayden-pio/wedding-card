<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">

  <title>표명선 ♥ 이예지 결혼합니다</title>

  <!-- 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <link rel="icon" type="image/svg+xml" href="https://msandyj.store/img/favicon.svg">

  <!-- 이 페이지는 어떤 하위 경로에서도 그대로 응답되므로
       상대 경로 자산을 참조하지 않고 스타일을 모두 인라인으로 둡니다. -->
  <style>
    :root {
      --bg:      #fbf8f4;
      --surface: #ffffff;
      --text:    #2b2421;
      --muted:   #8b7d72;
      --accent:  #c97b6b;
      --line:    #e8e0d6;

      --font-sans:    'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif:   'Noto Serif KR', 'Georgia', serif;
      --font-display: 'Cormorant Garamond', 'Georgia', serif;

      --radius: 8px;
      --shadow: 0 4px 40px rgba(43, 36, 33, 0.10);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; }

    .card {
      max-width: 480px;
      margin: 0 auto;
      background: var(--surface);
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 28px;
    }

    .notfound {
      text-align: center;
      width: 100%;
    }

    .notfound-mark {
      font-family: var(--font-display);
      font-size: 46px;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 30px;
    }

    .notfound-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }

    .notfound-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.9;
    }

    .notfound-line {
      width: 40px;
      height: 1px;
      background: var(--line);
      margin: 34px auto;
    }

    .notfound-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 30px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      text-decoration: none;
      border-radius: var(--radius);
      transition: opacity 0.2s ease;
    }

    .notfound-btn:hover  { opacity: 0.85; }
    .notfound-btn:active { opacity: 0.7; }

    /* Desktop: float the card over a soft background */
    @media (min-width: 768px) {
      body {
        background: linear-gradient(160deg, #ede8e3 0%, #ddd5cc 100%);
        padding: 40px 0 80px;
      }

      .card {
        box-shadow: var(--shadow);
        border-radius: var(--radius);
        overflow: hidden;
        min-height: calc(100vh - 120px);
      }
    }
  </style>
</head>
<body>

<main class="card">
  <div class="notfound">
    <p class="notfound-mark" aria-hidden="true">♥</p>
    <h1 class="notfound-title">페이지를 찾을 수 없어요</h1>
    <p class="notfound-desc">주소가 잘못되었거나<br>삭제된 페이지입니다.</p>
    <div class="notfound-line" aria-hidden="true"></div>
    <a class="notfound-btn" href="https://msandyj.store/">청첩장 보기 <span aria-hidden="true">→</span></a>
  </div>
</main>

</body>
</html>
